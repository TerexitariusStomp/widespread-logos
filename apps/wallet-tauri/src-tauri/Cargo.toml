[package]
name = "widespread-wallet-tauri"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Standalone crate — the desktop shell must not join the LEZ workspace (it
# would drag tauri/webview deps into every `cargo build --workspace`).
[workspace]
