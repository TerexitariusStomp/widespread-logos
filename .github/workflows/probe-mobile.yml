name: Build mobile wallet-core artifacts

# Produces the embeddable mobile libraries: libwsp_lez_ffi.so for Android
# (JNI-linked cdylib) and libwsp_lez_ffi.a for iOS (static archive Xcode
# links into the app target). The C ABI — wsp_lez_worker_new /
# wsp_lez_worker_execute / wsp_lez_free — wraps wsp-lez-core's Worker with
# the upstream `keycard` feature disabled (no pcsc-sys on mobile). Circuits
# bundles come from the fork release (upstream does not publish mobile
# assets yet).

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/wsp-lez-ffi/**"
      - "crates/wsp-lez-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/probe-mobile.yml"

env:
  CARGO_TERM_COLOR: always
  CIRCUITS_VERSION: v0.5.3
  RAPIDSNARK_VERSION: v0.0.8

jobs:
  android-lib:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Fetch circuits bundle (fork release)
        run: |
          curl -fL -o circuits.tar.gz \
            "https://github.com/TerexitariusStomp/logos-blockchain-circuits/releases/download/${CIRCUITS_VERSION}/logos-blockchain-circuits-${CIRCUITS_VERSION}-android-aarch64.tar.gz"
          mkdir -p lbc-root && tar -xzf circuits.tar.gz -C lbc-root --strip-components=1
          echo "LBC_ROOT_DIR=$PWD/lbc-root" >> "$GITHUB_ENV"

      - name: Fetch rapidsnark (iden3 android arm64)
        run: |
          curl -fL -o rs.zip \
            "https://github.com/iden3/rapidsnark/releases/download/${RAPIDSNARK_VERSION}/rapidsnark-android-arm64-${RAPIDSNARK_VERSION}.zip"
          unzip -o -q rs.zip
          echo "RAPIDSNARK_LIB_DIR=$PWD/rapidsnark-android-arm64-${RAPIDSNARK_VERSION}/lib" >> "$GITHUB_ENV"

      - name: Configure NDK toolchain for cargo
        run: |
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          # Append, not overwrite — the repo config carries the LEZ source
          # replacement that the lockfile depends on.
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$NDK_BIN/aarch64-linux-android26-clang"
          ar = "$NDK_BIN/llvm-ar"
          EOF
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: cargo check wsp-lez-core (no keycard / pcsc)
        run: cargo check -p wsp-lez-core --target "$TARGET" --no-default-features

      - name: cargo build libwsp_lez_ffi.so
        run: cargo build -p wsp-lez-ffi --release --target "$TARGET"

      - name: Verify artifact (aarch64 ELF, exports present)
        run: |
          # ANDROID_NDK_ROOT is runner-provided — not resolvable in `env:`.
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SO="target/$TARGET/release/libwsp_lez_ffi.so"
          test -f "$SO"
          file "$SO"
          "$NDK_BIN/llvm-readelf" -h "$SO" | grep -q 'Machine:.*AArch64'
          for sym in wsp_lez_worker_new wsp_lez_worker_execute wsp_lez_worker_free wsp_lez_free; do
            "$NDK_BIN/llvm-nm" -D --defined-only "$SO" | grep -q " $sym\$" || { echo "::error::missing export $sym"; exit 1; }
          done
          echo "all four FFI exports present"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsp-lez-ffi-android-aarch64
          path: target/aarch64-linux-android/release/libwsp_lez_ffi.so

  ios-lib:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-ios
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Fetch circuits bundle (fork release)
        run: |
          curl -fL -o circuits.tar.gz \
            "https://github.com/TerexitariusStomp/logos-blockchain-circuits/releases/download/${CIRCUITS_VERSION}/logos-blockchain-circuits-${CIRCUITS_VERSION}-ios-aarch64.tar.gz"
          mkdir -p lbc-root && tar -xzf circuits.tar.gz -C lbc-root --strip-components=1
          echo "LBC_ROOT_DIR=$PWD/lbc-root" >> "$GITHUB_ENV"

      - name: Fetch rapidsnark (iden3 iOS)
        run: |
          curl -fL -o rs.zip \
            "https://github.com/iden3/rapidsnark/releases/download/${RAPIDSNARK_VERSION}/rapidsnark-iOS-${RAPIDSNARK_VERSION}.zip"
          unzip -o -q rs.zip
          # iden3's iOS zip has no lib/ subdir — files sit at the archive root.
          # Their libgmp.a is a FAT archive (arm64 + arm64e slices); rustc's
          # archive reader cannot merge it into a staticlib ("Unsupported
          # archive identifier"). Thin it to the device slice in place.
          lipo -thin arm64 "rapidsnark-iOS-${RAPIDSNARK_VERSION}/libgmp.a" \
            -o "rapidsnark-iOS-${RAPIDSNARK_VERSION}/libgmp-thin.a"
          mv "rapidsnark-iOS-${RAPIDSNARK_VERSION}/libgmp-thin.a" \
             "rapidsnark-iOS-${RAPIDSNARK_VERSION}/libgmp.a"
          echo "RAPIDSNARK_LIB_DIR=$PWD/rapidsnark-iOS-${RAPIDSNARK_VERSION}" >> "$GITHUB_ENV"

      - name: cargo check wsp-lez-core (no keycard / pcsc)
        run: cargo check -p wsp-lez-core --target "$TARGET" --no-default-features

      - name: cargo build libwsp_lez_ffi.a (+ dylib)
        run: cargo build -p wsp-lez-ffi --release --target "$TARGET"

      - name: Verify artifact (arm64 archive, exports present)
        run: |
          LIB="target/$TARGET/release/libwsp_lez_ffi.a"
          test -f "$LIB"
          lipo -info "$LIB" | grep -q arm64
          for sym in wsp_lez_worker_new wsp_lez_worker_execute wsp_lez_worker_free wsp_lez_free; do
            nm -g --defined-only "$LIB" 2>/dev/null | grep -q " _$sym\$" || { echo "::error::missing export $sym"; exit 1; }
          done
          echo "all four FFI exports present"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsp-lez-ffi-ios-aarch64
          path: |
            target/aarch64-apple-ios/release/libwsp_lez_ffi.a
            target/aarch64-apple-ios/release/libwsp_lez_ffi.dylib
