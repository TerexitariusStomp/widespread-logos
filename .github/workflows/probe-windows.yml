name: Probe windows cross build

on:
  workflow_dispatch: {}

jobs:
  windows-lib:
    # Validates the mingw cross derivation before a release burns a version
    # on it. Builds the same attr the release's windows-x86_64 leg realises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: logos-co/setup-nix-cache-action@781f072122f4df6af0e33a7d355ebd20283e019e # v1.2.0
      - name: Build windows wallet static lib
        working-directory: modules/widespread_wallet
        run: |
          nix build ".#packages.x86_64-linux.widespread_wallet-windows-x86_64" --print-out-paths
      - name: Build windows .lgx bundle (builder pseudo-system)
        working-directory: modules/widespread_wallet
        run: |
          nix build ".#packages.x86_64-windows.lgx-portable" --print-out-paths
      - name: Dump failed build log
        if: failure()
        run: |
          echo "=== staged ext-lib output ==="
          ls -la result*/lib/ 2>/dev/null || true
          find /nix/store -maxdepth 2 -path "*widespread_wallet-windows*/lib" -exec ls -la {} \; 2>/dev/null | head -20
          drv=$(find /nix/store -maxdepth 1 -name "*module-lib-x86_64-w64-mingw32*.drv" | head -1)
          echo "=== link command ==="
          nix log "$drv" 2>/dev/null | grep -m8 "w64-mingw32-g++\|Linking\|FAILED" || true
          echo "=== undefined reference summary ==="
          nix log "$drv" 2>/dev/null | grep -o "undefined reference to [\`'][^\`']*[\`']" | sed "s/\`/'/g" | sort | uniq -c | sort -rn | head -40 || true
          nix log "$drv" 2>/dev/null | tail -40 || true
          echo "=== libstdc++ files in store ==="
          find /nix/store -name "libstdc++*" 2>/dev/null | head -20
          echo "=== where do shipped dlls point ==="
          readlink -f /nix/store/*qtbase*mingw32*/bin/libstdc++-6.dll 2>/dev/null || true
          find /nix/store -name "libstdc++-6.dll" -exec readlink {} \; 2>/dev/null | sort -u | head -10
          echo "=== gcc search paths (WRAPPER — carries CRT dirs) ==="
          cxx=$(find /nix/store -maxdepth 3 -path "*gcc-wrapper*" -name "x86_64-w64-mingw32-g++" -type f | head -1)
          echo "cxx=$cxx"
          "$cxx" -print-file-name=libstdc++.dll.a || true
          "$cxx" -print-file-name=libstdc++.a || true
          "$cxx" -print-search-dirs || true
          echo "=== does the staged dll export the missing vtables? ==="
          objdump=$(find /nix/store -maxdepth 3 -name "x86_64-w64-mingw32-objdump" -type f | head -1)
          wlib=$(find /nix/store -maxdepth 3 -path "*widespread_wallet-windows*" -name "libstdc++-6.dll" | head -1)
          echo "wlib=$wlib objdump=$objdump"
          "$objdump" -p "$wlib" 2>/dev/null | grep -c "Export" | head -3
          "$objdump" -p "$wlib" 2>/dev/null | grep "_ZTVSt9basic_ios\|_ZTVSt15basic_streambuf\|_ZNSt12system_errorC1ESt10error_codePKc\|__once_proxy\|_ZSt4cout" | head -10
          echo "=== protocol archive symbol check (exact file from link line) ==="
          nm=$(find /nix/store -maxdepth 3 -name "x86_64-w64-mingw32-nm" -type f | head -1)
          prota=$(nix log "$drv" 2>/dev/null | grep -o "/nix/store/[^ ]*liblogos_protocol\.a" | head -1)
          [ -z "$prota" ] && prota=$(find /nix/store -name "liblogos_protocol.a" | head -1)
          echo "nm=$nm prota=$prota"
          ls -la "$prota" 2>/dev/null || true
          "$nm" --defined-only "$prota" 2>/dev/null | grep -c basic_json || true
          "$nm" "$prota" 2>/dev/null | grep -c "basic_json" || true
          "$nm" -u "$prota" 2>/dev/null | grep -c "refptr" || true
          "$nm" --defined-only "$prota" 2>/dev/null | grep -c "refptr" || true
          echo "=== which libs provide fstat64i32 / SCard* / _setjmp ==="
          for lib in mingwex msvcrt ucrtbase ucrt winscard msvcrt-os moldname; do
            f=$("$cxx" -print-file-name=lib${lib}.a)
            echo "-- $f"
            "$nm" --defined-only "$f" 2>/dev/null | grep -c "fstat64i32\|SCardReleaseContext\|_setjmp" || true
          done
