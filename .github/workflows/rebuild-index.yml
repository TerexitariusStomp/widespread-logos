name: Rebuild catalog index

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [rebuild-index]
  schedule:
    - cron: "41 */6 * * *"

concurrency:
  group: widespread-catalog-index
  cancel-in-progress: true

jobs:
  rebuild:
    permissions:
      contents: write
    # v1 scans non-draft release .lgx URLs directly. Sidecars remain release
    # metadata and part of the release workflow's already-published gate.
    uses: logos-co/logos-modules-release-action/.github/workflows/rebuild-index.yml@v1
