name: Release widespread_wallet

on:
  workflow_dispatch: {}

# Shared with release-widespread-wallet-ui.yml and release-on-merge.yml so a
# manual dispatch cannot run concurrently with a merge-triggered release and
# have both write the same tag and assets. See release-on-merge.yml for the
# rationale (forked from logos-co/lez-faucet).
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: modules/widespread_wallet
      # Variants come from the module's flake.nix (#lgx-portable) — the flake
      # is the single source of truth for what is buildable.

