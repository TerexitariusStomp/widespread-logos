[workspace]
resolver = "3"
exclude = ["third_party", "programs"]
members = [
    "crates/wsp-lez-core",
    "crates/wsp-lezd",
    "crates/wsp-lez",
    "modules/widespread_wallet",
    "crates/wsp-lez-wasm",
    "crates/wsp-lez-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# workspace lints defined under [workspace.lints]

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
bip39 = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Upstream LEZ wallet engine — pinned to the deployed public testnet
# protocol tag (v0.2.x wire format; matches SPEL's lee_core pin).
# TEMPORARY FORK PIN: v0.2.4 + a `keycard` cargo feature only — identical
# protocol code, but lets mobile builds (Android/iOS, no PC/SC) compile with
# default-features = false. All six crates must come from the same source or
# Cargo builds two `lee` instances and AccountId stops unifying. Revert to
# the upstream tag once logos-blockchain/logos-execution-zone#924 merges.
common = { git = "https://github.com/TerexitariusStomp/logos-execution-zone", branch = "v0.2.4-keycard-gate" }
wallet = { git = "https://github.com/TerexitariusStomp/logos-execution-zone", branch = "v0.2.4-keycard-gate", default-features = false }
lee = { git = "https://github.com/TerexitariusStomp/logos-execution-zone", branch = "v0.2.4-keycard-gate" }
lee_core = { git = "https://github.com/TerexitariusStomp/logos-execution-zone", branch = "v0.2.4-keycard-gate" }
sequencer_service_rpc = { git = "https://github.com/TerexitariusStomp/logos-execution-zone", branch = "v0.2.4-keycard-gate", features = ["client"] }
system_accounts = { git = "https://github.com/TerexitariusStomp/logos-execution-zone", branch = "v0.2.4-keycard-gate" }
programs = { git = "https://github.com/TerexitariusStomp/logos-execution-zone", branch = "v0.2.4-keycard-gate", features = ["artifacts"] }

[workspace.lints.rust]

[workspace.lints.clippy]

# rust-rapidsnark pinned by upstream logos-blockchain (rev e91187f) fails to
# compile for x86_64-pc-windows-gnu (c_ulong vs u64 on LLP64). Redirect the
# git source to our windows-archive branch — same code + Windows fixes.
# Revert when logos-blockchain-rust-rapidsnark#2 merges upstream and
# logos-blockchain re-pins.
[patch."https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git"]
rust-rapidsnark = { git = "https://github.com/TerexitariusStomp/logos-blockchain-rust-rapidsnark.git", rev = "3e69004e2b3f920d83eebb70e348a3d70fbdc270" }

# risc0-zkvm 3.0.6's DefaultProver unconditionally imports std::os::fd /
# UnixStream (fd-passed r0vm spawn) — cannot compile for windows-gnu.
# The fork branch cfg(unix)-gates it; ExternalProver ("ipc") still works.
# Revert when upstream ships a windows-compatible prover module.
[patch.crates-io]
risc0-zkvm = { git = "https://github.com/TerexitariusStomp/risc0", rev = "32e0fdc36d8dc40f5fbe3dded56e57a8bd5916f4" }
# Unify risc0-binfmt onto the same source — otherwise the lockfile carries it
# from crates.io (via lez build_utils) AND from the fork (zkvm's workspace
# member), and cargo vendor fails on the duplicated checksum.
risc0-binfmt = { git = "https://github.com/TerexitariusStomp/risc0", rev = "32e0fdc36d8dc40f5fbe3dded56e57a8bd5916f4" }
