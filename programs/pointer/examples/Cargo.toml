[package]
name = "pointer-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate_idl"
path = "src/bin/generate_idl.rs"

[[bin]]
name = "cycle_bench"
path = "src/bin/cycle_bench.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel", rev = "6c0598a409ab801df843d99a46c04a13105df663" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core" }
pointer-methods = { path = "../methods" }
pointer_core = { path = "../pointer_core" }
serde_json = "1.0"
risc0-zkvm = "=3.0.5"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
borsh = { version = "1", features = ["derive"] }

